# Demo configuration of Argus, loaded through the Admin API by scripts/seed.sh
# (POST /admin/import). Nothing here is written to the database directly: every entry is
# validated, audited and published to the gateways like a request made by hand.
#
# It shows every part of module M1:
#   /orders    weighted 3:1 between orders-a and orders-b              (FR-02)
#   /users     least connections between users-a and users-b           (FR-02)
#   /products  10% canary to version v2, the rest to version v1        (FR-04, UC-08)
# Host names are the Docker Compose service names.

plans:
  - { id: free, name: Free, rateCapacity: 60,  ratePeriodMs: 60000, monthlyQuota: 10000 }
  - { id: pro,  name: Pro,  rateCapacity: 600, ratePeriodMs: 60000, monthlyQuota: 1000000 }

upstreams:
  - { id: orders-a,    serviceId: orders,   baseUri: "http://orders-a:8081",    weight: 3, version: v1 }
  - { id: orders-b,    serviceId: orders,   baseUri: "http://orders-b:8081",    weight: 1, version: v1 }
  - { id: users-a,     serviceId: users,    baseUri: "http://users-a:8081",     weight: 1, version: v1 }
  - { id: users-b,     serviceId: users,    baseUri: "http://users-b:8081",     weight: 1, version: v1 }
  - { id: products-v1, serviceId: products, baseUri: "http://products-v1:8081", weight: 1, version: v1 }
  - { id: products-v2, serviceId: products, baseUri: "http://products-v2:8081", weight: 1, version: v2 }

routes:
  - { id: orders, pathPrefix: /orders, serviceId: orders, loadBalancing: WEIGHTED,          timeoutMs: 5000 }
  - { id: users,  pathPrefix: /users,  serviceId: users,  loadBalancing: LEAST_CONNECTIONS, timeoutMs: 5000 }
  - id: products
    pathPrefix: /products
    serviceId: products
    loadBalancing: ROUND_ROBIN
    timeoutMs: 5000
    canaryVersion: v2
    canaryPercent: 10

# issueKey: a key is issued unless the consumer already has a working one. The keys are
# generated by the server and shown once; the seed script saves them for the demo scripts.
consumers:
  - { id: shop-app,    name: Shop App,    planId: free, issueKey: true }
  - { id: partner-api, name: Partner API, planId: pro,  issueKey: true }
  # The seed script revokes this consumer's key again, to have a revoked key to show.
  - { id: test-script, name: Test Script, planId: free, issueKey: true }
