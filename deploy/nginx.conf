events {}

http {
    # Level 1 load balancing: spread client traffic across gateway instances.
    upstream argus_gateways {
        server gateway-1:8080 max_fails=3 fail_timeout=10s;
        server gateway-2:8080 max_fails=3 fail_timeout=10s;
        server gateway-3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://argus_gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
