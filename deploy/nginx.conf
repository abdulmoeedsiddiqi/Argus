events {}

http {
    # Docker's built-in DNS. With "resolve" below, Nginx looks the gateway names up again
    # every few seconds, so a gateway that was restarted is found even if its address changed.
    resolver 127.0.0.11 valid=5s;

    # Level 1 load balancing: spread client traffic across the gateway instances (round robin).
    upstream argus_gateways {
        zone argus_gateways 64k;
        server gateway-1:8080 resolve max_fails=3 fail_timeout=10s;
        server gateway-2:8080 resolve max_fails=3 fail_timeout=10s;
        server gateway-3:8080 resolve max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://argus_gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # An instance that is down, or not ready yet (it answers 503 until it has replayed
            # the configuration topic, QR-09), is skipped: the request goes to the next one.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
