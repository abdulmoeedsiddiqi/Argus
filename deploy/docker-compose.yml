# Routing demo (no profile needed): gateway-1 in front of six backend copies.
#   docker compose -f deploy/docker-compose.yml up --build -d
#   curl -i http://localhost:8080/orders/42      (see X-Argus-Upstream for the chosen copy)
#   deploy/smoke-test.sh
#
# Profiles:
#   core - infrastructure for day-to-day development (PostgreSQL, Redis, Kafka)
#   full - everything: 3 gateways behind Nginx, services, monitoring
name: argus

x-gateway: &gateway
  image: argus-gateway
  build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: argus-gateway } }
  mem_limit: 512m
  environment: &gateway-env
    # Routes and backend copies of the demo: argus-gateway/src/main/resources/application-demo.yml
    SPRING_PROFILES_ACTIVE: demo
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_DATA_REDIS_HOST: redis
    JAVA_TOOL_OPTIONS: -Xmx384m

# One image, run six times; SERVICE_NAME tells each copy who it is.
x-upstream: &upstream
  image: argus-mock-service
  build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: upstreams/mock-service } }
  mem_limit: 256m

services:
  postgres:
    image: postgres:16
    profiles: [core, full]
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    ports: ["5432:5432"]

  redis:
    image: redis:7
    profiles: [core, full]
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.1
    profiles: [core, full]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m

  # No profile: part of the routing demo. Published on 8080 until Nginx takes that port.
  gateway-1:
    <<: *gateway
    ports: ["8080:8080"]
    environment: { <<: *gateway-env, ARGUS_INSTANCE_ID: gateway-1 }
    depends_on: [orders-a, orders-b, users-a, users-b, products-v1, products-v2]
  gateway-2:
    <<: *gateway
    profiles: [full]
    environment: { <<: *gateway-env, ARGUS_INSTANCE_ID: gateway-2 }
    depends_on: [kafka, redis]
  gateway-3:
    <<: *gateway
    profiles: [full]
    environment: { <<: *gateway-env, ARGUS_INSTANCE_ID: gateway-3 }
    depends_on: [kafka, redis]

  nginx:
    image: nginx:1.27
    profiles: [full]
    ports: ["8000:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [gateway-1, gateway-2, gateway-3]

  admin:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: argus-admin } }
    profiles: [full]
    mem_limit: 384m
    # Admin API on host port 9000 (scope document, Section 7.2); 8081 belongs to the backends.
    ports: ["9000:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/argus
      SPRING_DATASOURCE_USERNAME: argus
      SPRING_DATASOURCE_PASSWORD: argus
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on: [postgres, kafka]

  metering:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: argus-metering } }
    profiles: [full]
    mem_limit: 384m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/argus
      SPRING_DATASOURCE_USERNAME: argus
      SPRING_DATASOURCE_PASSWORD: argus
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on: [postgres, kafka]

  abuse:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: argus-abuse } }
    profiles: [full]
    mem_limit: 384m
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on: [kafka]

  # Backend copies (no profile). Orders: weighted 3:1. Users: least connections.
  # Products: version v2 is a 10% canary. Host ports are published only so that
  # POST /fault can be tried by hand: orders-a on 8081, orders-b on 8082, products-v2 on 8083.
  orders-a:
    <<: *upstream
    ports: ["8081:8081"]
    environment: { SERVICE_NAME: orders-a }
  orders-b:
    <<: *upstream
    ports: ["8082:8081"]
    environment: { SERVICE_NAME: orders-b }
  users-a:
    <<: *upstream
    environment: { SERVICE_NAME: users-a }
  users-b:
    <<: *upstream
    environment: { SERVICE_NAME: users-b }
  products-v1:
    <<: *upstream
    environment: { SERVICE_NAME: products-v1 }
  products-v2:
    <<: *upstream
    ports: ["8083:8081"]
    environment: { SERVICE_NAME: products-v2 }

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [full]
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [full]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [full]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: argus
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]
