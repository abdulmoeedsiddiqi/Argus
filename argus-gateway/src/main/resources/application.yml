server:
  port: ${PORT:8080}

spring:
  threads:
    virtual:
      enabled: true

# Routes and backend copies. Empty by default: every request then gets 404 ROUTE_NOT_FOUND.
# The "demo" profile (application-demo.yml) defines the Users, Orders and Products demo setup.
# From module M5 on, routes arrive from the Admin API through the configuration topic instead.
argus:
  health-check:
    enabled: true
    path: /health
    interval: 5s
    timeout: 2s
    failure-threshold: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      # Redis is not used until the rate limiter (M3) is built.
      enabled: false
