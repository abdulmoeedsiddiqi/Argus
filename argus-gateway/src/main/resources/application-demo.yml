# Demo profile for Docker Compose (SPRING_PROFILES_ACTIVE=demo).
#
# Routes, backend copies and API keys are no longer written here. They are created through the
# Admin API (deploy/seed/demo-config.yaml, loaded by scripts/seed.sh) and reach every gateway
# instance through the Kafka configuration topic (ARGUS_CONFIG_SOURCE=kafka in Compose).
#
# Only the settings that are not part of that configuration remain. The JWT secret is not in
# this file: the gateway reads it from the environment variable ARGUS_AUTH_JWT_SECRET.
argus:
  auth:
    jwt:
      issuer: argus-demo
